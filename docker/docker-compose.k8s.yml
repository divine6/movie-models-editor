# 模拟 K8s 环境：仅应用容器，连接外部 MySQL（与 k8s/deploy.yaml 一致）
# 在 saas3.0 目录执行:
#   docker compose -f movie-models-editor/docker/docker-compose.k8s.yml up -d --build
#
# 镜像仓库配置见 docker/harbor.env

services:
  app:
    build:
      context: ../..
      dockerfile: movie-models-editor/docker/Dockerfile
      secrets:
        - npmrc
      args:
        VITE_API_URL: ${VITE_API_URL:-https://ext.highlands.ltd/light-sass-api/}
        VITE_PUBLIC_PATH: ${VITE_PUBLIC_PATH:-/movie-editor/}
        VITE_EDITOR_SERVER_URL: ${VITE_EDITOR_SERVER_URL:-/movie-editor}
        VITE_EDITOR_FRONTEND_URL: ${VITE_EDITOR_FRONTEND_URL:-/movie-editor}
    image: ${APP_IMAGE:-core.harbor.domain:30003/movie-editor/movie-editor:latest}
    container_name: movie-editor-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    environment:
      PORT: 4000
      STORAGE_DRIVER: mysql
      BASE_PATH: ${BASE_PATH:-/movie-editor}
      EDITOR_FRONTEND_URL: ${EDITOR_FRONTEND_URL:-https://api.highlands.ltd/movie-editor}
      DB_HOST: ${DB_HOST:-192.168.10.220}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-movie_models}
    volumes:
      - movie_editor_uploads:/app/storage

volumes:
  movie_editor_uploads:

secrets:
  npmrc:
    file: ${NPMRC:-${USERPROFILE}/.npmrc}
