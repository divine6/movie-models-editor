# movie-editor-v2 K8s 部署清单（与现网并行，不替换现网 Deployment movie-editor）
# namespace: u3d | service: movie-editor-v2 | 镜像拉取密钥: harbor
# 外部 MySQL: 192.168.10.220:3306  库名: movie_editor_v2
# 线上访问: https://api.highlands.ltd/movie-editor-v2
#
# 本文件已全部指向 v2，apply 不会改现网 movie-editor。
# 网关需追加路径（不要改现网 /movie-editor）:
#   /movie-editor-v2 → service movie-editor-v2:4000
#
# 部署: k8s\deploy.bat  或  kubectl apply -f k8s/deploy.yaml

apiVersion: v1
kind: Secret
metadata:
  name: movie-editor-v2-db
  namespace: u3d
type: Opaque
stringData:
  DB_USER: shuaipeng.liu
  DB_PASSWORD: shuaipeng.liu
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movie-editor-v2-uploads
  namespace: u3d
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-editor-v2
  namespace: u3d
  labels:
    app: movie-editor-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-editor-v2
  template:
    metadata:
      labels:
        app: movie-editor-v2
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: movie-editor-v2
          image: core.harbor.domain:30003/movie-editor/movie-editor-v2:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: STORAGE_DRIVER
              value: mysql
            - name: DB_HOST
              value: "192.168.10.220"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: movie_editor_v2
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: movie-editor-v2-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: movie-editor-v2-db
                  key: DB_PASSWORD
            - name: PUBLIC_PATH
              value: "/movie-editor-v2"
            - name: BASE_PATH
              value: ""
            - name: EDITOR_FRONTEND_URL
              value: "https://api.highlands.ltd/movie-editor-v2"
          volumeMounts:
            - name: uploads
              mountPath: /app/storage
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: movie-editor-v2-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: movie-editor-v2
  namespace: u3d
  labels:
    app: movie-editor-v2
spec:
  type: NodePort
  selector:
    app: movie-editor-v2
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30401
